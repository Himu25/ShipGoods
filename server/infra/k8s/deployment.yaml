# Secrets live in a Secret, never in this file:
#   kubectl create secret generic shipgoods-api-env --from-env-file=.env
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipgoods-api
spec:
  # Safe to run >1: Socket.IO rooms fan out over the Redis adapter, and
  # call/throttle state is in Redis, not process memory. Clients connect
  # WebSocket-only, so no sticky sessions are needed.
  replicas: 3
  selector:
    matchLabels:
      app: shipgoods-api
  template:
    metadata:
      labels:
        app: shipgoods-api
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: api
          image: shipgoods-api:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: shipgoods-api-env
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
